name: OpenSSF Scorecard

# Weekly audit of the repository's security posture (branch protection, pinned
# dependencies, token permissions, dangerous workflows, signed releases, ...).
# Results go to the Security tab (code scanning) and the public Scorecard API,
# which powers the README badge.

on:
    branch_protection_rule:
    schedule:
        - cron: "11 5 * * 1"
    push:
        branches: [main]
    workflow_dispatch:

permissions: read-all

jobs:
    analysis:
        name: Scorecard analysis
        runs-on: ubuntu-latest
        permissions:
            security-events: write
            id-token: write
            contents: read
            actions: read
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  persist-credentials: false

            - name: Run analysis
              uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
              with:
                  results_file: results.sarif
                  results_format: sarif
                  publish_results: true

            - name: Upload artifact
              uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
              with:
                  name: scorecard-sarif
                  path: results.sarif
                  retention-days: 5

            - name: Upload to code scanning
              uses: github/codeql-action/upload-sarif@a3d1b77a1ba1550fbb5c74db1dc3a11f4a481126 # v3.39.2
              with:
                  sarif_file: results.sarif
