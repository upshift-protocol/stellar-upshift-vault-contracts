name: Release & Attest

# Push a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) to build,
# attest, publish, and register each contract with stellar.expert.
#
# Trust model (see the review that shaped this):
#   guard   - verifies the tagged commit is on `main` and the ci.yml *push* run passed.
#   build   - UNPRIVILEGED. Runs cargo, so build scripts / proc-macros execute here;
#             it therefore has contents:read only, no GH_TOKEN, no OIDC, and no
#             persisted checkout credentials. It hands the compiled WASM to the
#             next job as an artifact.
#   publish - PRIVILEGED, gated by the protected `release` environment (independent
#             reviewer). It does NOT execute repository code — only the downloaded
#             artifact: attest -> publish -> register. Attest before publish (a
#             published release is always attested); publish before register (the
#             asset must exist when stellar.expert's async worker runs).
#
# Self-contained (no upstream reusable workflow); every nested action is pinned by
# SHA. See VERIFY.md to reproduce a hash locally.

on:
    push:
        tags:
            - "v*"

# Serialize releases per tag; never cancel an in-flight release.
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    guard:
        name: Guard — on main + CI green
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
        env:
            GH_TOKEN: ${{ github.token }}
            REPO: ${{ github.repository }}
            SHA: ${{ github.sha }}
        steps:
            - name: Require the tagged commit to be on main
              run: |
                  set -euo pipefail
                  status=$(gh api "repos/$REPO/compare/main...$SHA" --jq '.status')
                  echo "compare main...$SHA => $status"
                  case "$status" in
                    identical|behind) echo "Tagged commit is on main." ;;
                    *) echo "::error::Refusing to release: tagged commit $SHA is not on main (status=$status)."; exit 1 ;;
                  esac

            - name: Require the ci.yml push run to have succeeded for this commit
              run: |
                  set -euo pipefail
                  # Bind to the specific workflow file + push event, not just a check
                  # named "CI Pass" (which any push-access user could otherwise spoof).
                  n=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&status=completed&per_page=100" \
                    --jq '[.workflow_runs[] | select(.conclusion=="success")] | length')
                  echo "successful ci.yml (push) runs for $SHA: ${n:-0}"
                  if [ "${n:-0}" -lt 1 ]; then
                    echo "::error::Refusing to release: no successful ci.yml (push) run for $SHA."
                    exit 1
                  fi

    build:
        name: Build (unprivileged) — ${{ matrix.package }}
        needs: guard
        runs-on: ubuntu-latest
        # Build executes untrusted code (build scripts / proc-macros): no write
        # scopes, no token, no OIDC, no persisted credentials.
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                package: [august-vault, xlm-strategy]
        env:
            REPO: ${{ github.repository }}
            PACKAGE: ${{ matrix.package }}
            RUSTUP_TOOLCHAIN: "1.95.0" # pin the compiler
        steps:
            - name: Checkout the tagged commit (no persisted credentials)
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false

            - name: Install pinned Rust 1.95.0 + wasm target
              run: |
                  set -euo pipefail
                  rustup toolchain install 1.95.0 --profile minimal
                  rustup target add wasm32v1-none --toolchain 1.95.0
                  rustc +1.95.0 --version

            - name: Install Stellar CLI 25.1.0 (pinned .deb, checksum-verified)
              env:
                  STELLAR_CLI_DEB_SHA256: "0260de467b29883c7cc227a3d8df7b7d8723805ffa54dcfe8171af1255de33c8"
              run: |
                  set -euo pipefail
                  curl -fsSL -o /tmp/stellar-cli.deb \
                    https://github.com/stellar/stellar-cli/releases/download/v25.1.0/stellar-cli_25.1.0_amd64.deb
                  echo "${STELLAR_CLI_DEB_SHA256}  /tmp/stellar-cli.deb" | sha256sum -c -
                  sudo dpkg -i /tmp/stellar-cli.deb
                  rm /tmp/stellar-cli.deb
                  stellar --version

            - name: Build (optimized, locked)
              run: |
                  set -euo pipefail
                  # --locked fails if Cargo.lock isn't consistent with the tagged source,
                  # so the runner can't silently resolve a different dependency graph.
                  VER=$(cargo metadata --format-version=1 --no-deps --locked \
                    | jq -r --arg p "$PACKAGE" '.packages[] | select(.name==$p) | .version')
                  [ -n "$VER" ] || { echo "::error::could not resolve version for $PACKAGE"; exit 1; }
                  OUT="$GITHUB_WORKSPACE/dist"
                  mkdir -p "$OUT"
                  stellar contract build --optimize \
                    --package "$PACKAGE" \
                    --out-dir "$OUT" \
                    --meta source_repo="github:$REPO"
                  SRC=$(find "$OUT" -name '*.wasm' | head -1)
                  [ -n "$SRC" ] || { echo "::error::no wasm produced for $PACKAGE"; exit 1; }
                  NAME="${PACKAGE}_v${VER}.wasm"
                  [ "$(basename "$SRC")" = "$NAME" ] || mv "$SRC" "$OUT/$NAME"
                  # Belt-and-suspenders: fail if the build mutated the lockfile.
                  git diff --exit-code -- Cargo.lock
                  sha256sum "$OUT/$NAME"

            - name: Upload build artifact
              uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
              with:
                  name: wasm-${{ matrix.package }}
                  path: dist/*.wasm
                  if-no-files-found: error
                  retention-days: 7

    publish:
        name: Attest, publish & register (privileged) — ${{ matrix.package }}
        needs: build
        runs-on: ubuntu-latest
        # Independent-reviewer gate for producing official, deployable artifacts.
        environment: release
        permissions:
            id-token: write # OIDC for the build attestation
            contents: write # create the release
            attestations: write # write the attestation
        strategy:
            fail-fast: false
            matrix:
                package: [august-vault, xlm-strategy]
        env:
            GH_TOKEN: ${{ github.token }}
            REPO: ${{ github.repository }}
            SHA: ${{ github.sha }}
            TAG: ${{ github.ref_name }}
            SERVER_URL: ${{ github.server_url }}
            RUN_ID: ${{ github.run_id }}
            PACKAGE: ${{ matrix.package }}
        steps:
            - name: Download the built artifact
              uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
              with:
                  name: wasm-${{ matrix.package }}
                  path: dist

            - name: Resolve artifact + hash
              id: art
              run: |
                  set -euo pipefail
                  WASM=$(find dist -name '*.wasm' | head -1)
                  [ -n "$WASM" ] || { echo "::error::artifact wasm missing"; exit 1; }
                  HASH=$(sha256sum "$WASM" | cut -d' ' -f1)
                  {
                    echo "path=$WASM"
                    echo "name=$(basename "$WASM")"
                    echo "hash=$HASH"
                  } >> "$GITHUB_OUTPUT"
                  echo "Artifact $(basename "$WASM") sha256=$HASH"

            - name: Attest build provenance
              uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
              with:
                  subject-path: ${{ steps.art.outputs.path }}
                  subject-name: ${{ steps.art.outputs.name }}

            - name: Publish release (idempotent, never clobber)
              env:
                  WASM_PATH: ${{ steps.art.outputs.path }}
                  WASM_NAME: ${{ steps.art.outputs.name }}
                  WASM_HASH: ${{ steps.art.outputs.hash }}
              run: |
                  set -euo pipefail
                  # Package-prefixed (NOT v-prefixed) so this derived tag neither
                  # matches the protected `v*` ruleset nor re-triggers this workflow.
                  REL="${PACKAGE}-${TAG}"
                  NOTES="Reproducible build of ${PACKAGE} at ${SHA} (target wasm32v1-none, Rust 1.95.0, Stellar CLI 25.1.0, --meta source_repo=github:${REPO}). WASM sha256: ${WASM_HASH}. Reproduce: check out ${SHA} and follow section B of VERIFY.md. Vaults are upgradeable — verification is point-in-time; re-fetch the current on-chain hash."
                  if gh release view "$REL" >/dev/null 2>&1; then
                    # The tag must point at exactly this commit, else the (immutable)
                    # source archive would disagree with the asset/attestation.
                    existing_sha=$(gh api "repos/$REPO/commits/$REL" --jq '.sha' 2>/dev/null || echo "")
                    [ "$existing_sha" = "$SHA" ] || { echo "::error::release $REL tag points to '${existing_sha:-unknown}', not $SHA"; exit 1; }
                    # Never clobber published bytes. Compare the existing asset's digest:
                    # skip if identical, fail if different, upload only if missing.
                    tmp=$(mktemp -d)
                    if gh release download "$REL" --pattern "$WASM_NAME" --dir "$tmp" 2>/dev/null; then
                      pub=$(sha256sum "$tmp/$WASM_NAME" | cut -d' ' -f1)
                      if [ "$pub" = "$WASM_HASH" ]; then
                        echo "Asset already published with matching hash — nothing to do."
                      else
                        echo "::error::published asset hash $pub != $WASM_HASH; refusing to replace published bytes"; exit 1
                      fi
                    else
                      echo "Release exists but asset missing — uploading (no clobber)."
                      gh release upload "$REL" "$WASM_PATH"
                    fi
                  else
                    # --target pins the created tag (and its source archive) to the exact
                    # commit that produced the attested WASM.
                    gh release create "$REL" "$WASM_PATH" \
                      --target "$SHA" \
                      --title "${PACKAGE} ${TAG}" \
                      --notes "$NOTES"
                  fi

            - name: Register with stellar.expert (fail loud)
              env:
                  WASM_HASH: ${{ steps.art.outputs.hash }}
              run: |
                  set -euo pipefail
                  payload=$(jq -nc \
                    --arg repository "$SERVER_URL/$REPO" \
                    --arg commitHash "$SHA" \
                    --arg jobId "publish" \
                    --arg runId "$RUN_ID" \
                    --arg contractHash "$WASM_HASH" \
                    --arg packageName "$PACKAGE" \
                    '{repository:$repository, commitHash:$commitHash, jobId:$jobId, runId:$runId, contractHash:$contractHash, packageName:$packageName}')
                  echo "Enqueuing stellar.expert validation: $payload"
                  # Registration is asynchronous — the endpoint queues the request and
                  # returns {ok:1}; the asset is already published above so the worker can
                  # find it. --fail-with-body still surfaces transport/HTTP errors. Final
                  # validation state is confirmed on stellar.expert once the worker runs.
                  curl --fail-with-body -sS -X POST \
                    "https://api.stellar.expert/explorer/public/contract-validation/match" \
                    -H "Content-Type: application/json" \
                    -d "$payload" \
                    --max-time 30
