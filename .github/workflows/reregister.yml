name: Re-register with stellar.expert

# Manually re-send an existing release's stellar.expert validation request.
#
# stellar.expert now only accepts validation requests from GitHub Actions runners
# (direct POSTs get 403), and the original release run is too old to re-run. This
# re-sends the exact payload release.yml sent, pointing at that original run.
#
# Read-only: builds nothing, publishes nothing, and changes no release or
# attestation. Hashes come from the published (immutable) release assets.
#
# TEMPORARY experiment (AUGUST-7177). stellar.expert says it discards requests
# that weren't built by its own soroban-build-workflow, so this may be ignored
# even when it returns {ok:1}. Delete this file once that is settled either way.
# The registration loop and PACKAGES are copied from release.yml's publish job.

on:
    workflow_dispatch:
        inputs:
            tag:
                description: "Released tag to re-register (e.g. v0.1.1)"
                required: true

# One re-registration per tag at a time.
concurrency:
    group: reregister-${{ inputs.tag }}
    cancel-in-progress: false

jobs:
    reregister:
        name: Re-register ${{ inputs.tag }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            attestations: read
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
            REPO: ${{ github.repository }}
            SERVER_URL: ${{ github.server_url }}
            TAG: ${{ inputs.tag }}
        steps:
            - name: Resolve attested assets, release run, and commit
              run: |
                  set -euo pipefail
                  [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || { echo "::error::tag must look like vX.Y.Z[-suffix] (got $TAG)"; exit 1; }

                  mkdir -p dist
                  gh release download "$TAG" --pattern '*.wasm' --dir dist

                  # Same exact-manifest rule as release.yml: no missing, extra or
                  # wrong-version assets. Keep in sync with release.yml's PACKAGES.
                  PACKAGES=(august-vault xlm-strategy)
                  EXPECTED=$(for p in "${PACKAGES[@]}"; do echo "${p}_${TAG}.wasm"; done | sort)
                  GOT=$(find dist -name '*.wasm' -printf '%f\n' | sort)
                  if [ "$GOT" != "$EXPECTED" ]; then
                    echo "::error::release assets do not match the required manifest."
                    printf 'expected:\n%s\ngot:\n%s\n' "$EXPECTED" "$GOT"
                    exit 1
                  fi

                  # Only register bytes that release.yml itself attested for this tag, and
                  # take the run + commit from that provenance rather than from the run's
                  # conclusion: a release whose original POST failed has a failed run but
                  # valid, attested assets, and that is exactly the case this exists for.
                  prov=$(for w in dist/*.wasm; do
                    gh attestation verify "$w" --repo "$REPO" \
                      --signer-workflow "$REPO/.github/workflows/release.yml" \
                      --source-ref "refs/tags/$TAG" --format json \
                      | jq -r '.[].verificationResult.signature.certificate
                               | "\(.runInvocationURI | capture("/actions/runs/(?<id>[0-9]+)/").id) \(.sourceRepositoryDigest)"' \
                      || exit 1 # every asset must verify, not just the last one in the loop
                  done | sort -u)
                  [ -n "$prov" ] && [ "$(printf '%s\n' "$prov" | wc -l)" -eq 1 ] || { echo "::error::assets not attested by exactly one run/commit:"; echo "$prov"; exit 1; }
                  read -r RUN_ID SHA <<< "$prov"
                  echo "attesting run: $RUN_ID  commit: $SHA"

                  # The attested commit must be the one the tag points at now (guards a
                  # re-pushed tag pairing old provenance with a different commit).
                  tag_sha=$(gh api "repos/$REPO/commits/$TAG" --jq '.sha')
                  [ "$tag_sha" = "$SHA" ] || { echo "::error::attested commit $SHA != current $TAG commit $tag_sha"; exit 1; }
                  echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
                  echo "SHA=$SHA" >> "$GITHUB_ENV"

            - name: Re-send stellar.expert validation requests
              run: |
                  set -euo pipefail
                  # Same payload shape and assertions as release.yml's publish job.
                  for w in dist/*.wasm; do
                    name=$(basename "$w")
                    pkg="${name%_v*}"
                    hash=$(sha256sum "$w" | cut -d' ' -f1)
                    payload=$(jq -nc \
                      --arg repository "$SERVER_URL/$REPO" \
                      --arg commitHash "$SHA" \
                      --arg jobId "publish" \
                      --arg runId "$RUN_ID" \
                      --arg contractHash "$hash" \
                      --arg packageName "$pkg" \
                      '{repository:$repository, commitHash:$commitHash, jobId:$jobId, runId:$runId, contractHash:$contractHash, packageName:$packageName}')
                    echo "Enqueuing stellar.expert validation for $pkg: $payload"
                    set +e
                    resp=$(curl --fail-with-body -sS -X POST \
                      "https://api.stellar.expert/explorer/public/contract-validation/match" \
                      -H "Content-Type: application/json" -d "$payload" --max-time 30)
                    rc=$?
                    set -e
                    echo "HTTP rc=$rc response: $resp"
                    [ "$rc" -eq 0 ] || { echo "::error::stellar.expert POST failed for $pkg (rc=$rc): $resp"; exit 1; }
                    ok=$(printf '%s' "$resp" | jq -r '.ok // empty')
                    [ "$ok" = "1" ] || { echo "::error::stellar.expert did not accept $pkg (ok=${ok:-none}): $resp"; exit 1; }
                  done
