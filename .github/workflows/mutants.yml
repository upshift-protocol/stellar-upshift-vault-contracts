name: Mutation Testing

# Weekly cargo-mutants run. Line coverage (gated at 80% on PRs) says code was
# executed; mutation testing says the tests would FAIL if it were wrong — e.g.
# a flipped comparison, a Floor/Ceil swap, or a dropped require_auth.
#
# Report-only: surviving ("missed") mutants are listed in each shard's job
# summary and uploaded as an artifact for triage. Sharded so the full run fits
# comfortably in runner time limits. The shard count is the matrix length.

on:
    schedule:
        - cron: "41 4 * * 0"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    mutants:
        name: cargo-mutants (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        runs-on: ubuntu-latest
        timeout-minutes: 300
        strategy:
            fail-fast: false
            matrix:
                shard: [0, 1, 2, 3, 4, 5, 6, 7]
        env:
            # Keep property tests cheap per mutant; the nightly run goes deep.
            PROPTEST_CASES: "64"
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0

            - name: Install cargo-mutants
              uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
              with:
                  tool: cargo-mutants@27.1.0

            - name: Cache Cargo
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
                  key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-mutants-

            - name: Run cargo-mutants
              env:
                  SHARD: ${{ matrix.shard }}
                  TOTAL: ${{ strategy.job-total }}
              run: |
                  set -uo pipefail
                  # Only shard 0 checks the unmutated baseline; the rest skip it.
                  baseline=$([ "$SHARD" -eq 0 ] && echo run || echo skip)
                  cargo mutants --workspace --shard "${SHARD}/${TOTAL}" --no-shuffle \
                    --baseline "$baseline" --timeout-multiplier 3 --output "mutants-${SHARD}"
                  code=$?
                  # 0 = all caught, 2 = missed mutants, 3 = timeouts: report, don't fail.
                  case "$code" in 0|2|3) ;; *) exit "$code" ;; esac

            - name: Summarize
              if: always()
              env:
                  SHARD: ${{ matrix.shard }}
                  TOTAL: ${{ strategy.job-total }}
              run: |
                  dir="mutants-${SHARD}/mutants.out"
                  {
                    echo "### cargo-mutants shard ${SHARD}/${TOTAL}"
                    for f in caught missed timeout unviable; do
                      n=$(wc -l < "$dir/$f.txt" 2>/dev/null || echo 0)
                      echo "- **$f**: $n"
                    done
                    if [ -s "$dir/missed.txt" ]; then
                      echo; echo "#### Missed mutants"; echo '```'; cat "$dir/missed.txt"; echo '```'
                    fi
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Upload results
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: mutants-shard-${{ matrix.shard }}
                  path: mutants-${{ matrix.shard }}/mutants.out
                  retention-days: 30
