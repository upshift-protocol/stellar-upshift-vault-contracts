name: Mainnet Monitor

# Hourly check that every live mainnet contract still runs the approved WASM.
#
# The vaults are upgradeable: the admin can replace the bytecode at any time.
# This workflow fetches each contract's live WASM from TWO independent RPC
# providers, hashes it, and compares it to deployments/mainnet.txt.
#
#   drift     -> `mainnet-wasm-drift` issue, assigned to ALERT_ASSIGNEES, plus a
#                Slack post. Every DISTINCT drift (a new contract/hash pair) is
#                alerted, even while an older drift issue is still open.
#   RPC error -> `mainnet-monitor-degraded` issue (assigned, no Slack), so a
#                dead provider can't silently turn the monitor off.
#   keepalive -> GitHub disables schedules in public repos after 60 days with
#                no repository activity; each run re-enables this workflow via
#                the API to reset that timer.
#
# Repo configuration:
#   secrets.SLACK_WEBHOOK_URL   Slack incoming webhook (strongly recommended)
#   vars.ALERT_ASSIGNEES        comma-separated logins (default below)
#   vars.MAINNET_RPC_PRIMARY / vars.MAINNET_RPC_SECONDARY  RPC overrides

on:
    schedule:
        - cron: "17 * * * *"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: mainnet-monitor
    cancel-in-progress: false

env:
    ALERT_ASSIGNEES: ${{ vars.ALERT_ASSIGNEES || 'gr-august,ae2212,cjeva10' }}

jobs:
    check:
        name: Live WASM hash check
        runs-on: ubuntu-latest
        timeout-minutes: 15
        outputs:
            drift: ${{ steps.check.outputs.drift }}
            rpc_err: ${{ steps.check.outputs.rpc_err }}
            fingerprint: ${{ steps.check.outputs.fingerprint }}
        env:
            NETWORK_PASSPHRASE: "Public Global Stellar Network ; September 2015"
            RPC_PRIMARY: ${{ vars.MAINNET_RPC_PRIMARY || 'https://mainnet.sorobanrpc.com' }}
            RPC_SECONDARY: ${{ vars.MAINNET_RPC_SECONDARY || 'https://soroban-rpc.mainnet.stellar.gateway.fm' }}
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  persist-credentials: false

            - name: Install Stellar CLI 27.0.0 (pinned .deb, checksum-verified)
              env:
                  STELLAR_CLI_DEB_SHA256: "4b3755e13ba7514a108e422b02c75233face37c3e2cde131f55e6c7ce6eea44e"
              run: |
                  set -euo pipefail
                  curl -fsSL -o /tmp/stellar-cli.deb \
                    https://github.com/stellar/stellar-cli/releases/download/v27.0.0/stellar-cli_27.0.0_amd64.deb
                  echo "${STELLAR_CLI_DEB_SHA256}  /tmp/stellar-cli.deb" | sha256sum -c -
                  sudo dpkg -i /tmp/stellar-cli.deb

            - name: Compare live hashes to deployments/mainnet.txt
              id: check
              run: |
                  set -uo pipefail
                  drift=0; rpc_err=0
                  report=/tmp/report.md
                  drifted=/tmp/drifted.txt
                  : > "$drifted"
                  {
                    echo "| Contract | ID | Approved | Live (${RPC_PRIMARY}) | Live (${RPC_SECONDARY}) |"
                    echo "| --- | --- | --- | --- | --- |"
                  } > "$report"

                  fetch() { # rpc id -> sha256 or "ERROR"
                    local tag out
                    tag=$(echo "$1" | sha256sum | cut -c1-8)
                    out="/tmp/$2-$tag.wasm"
                    if stellar contract fetch --id "$2" --rpc-url "$1" \
                         --network-passphrase "$NETWORK_PASSPHRASE" --out-file "$out" >/dev/null 2>&1; then
                      sha256sum "$out" | cut -d' ' -f1
                    else
                      echo ERROR
                    fi
                  }

                  while read -r name id expected _; do
                    case "$name" in ''|\#*) continue ;; esac
                    a=$(fetch "$RPC_PRIMARY" "$id")
                    b=$(fetch "$RPC_SECONDARY" "$id")
                    this_drift=0; this_err=0
                    for h in "$a" "$b"; do
                      if [ "$h" = ERROR ]; then
                        this_err=1
                      elif [ "$h" != "$expected" ]; then
                        this_drift=1
                        echo "$id $h" >> "$drifted"
                      fi
                    done
                    # Drift outranks an RPC error in the status label.
                    if [ "$this_drift" -eq 1 ]; then status="🚨 DRIFT"; drift=1
                    elif [ "$this_err" -eq 1 ]; then status="⚠️ RPC error"; rpc_err=1
                    else status="✅"; fi
                    echo "$status $name $id expected=$expected primary=$a secondary=$b"
                    echo "| $status $name | \`$id\` | \`${expected:0:12}…\` | \`${a:0:12}…\` | \`${b:0:12}…\` |" >> "$report"
                  done < deployments/mainnet.txt

                  # Identifies WHICH contract moved to WHICH hash, so a new drift
                  # is alerted even if an older drift issue is still open.
                  fingerprint=$(sort -u "$drifted" | sha256sum | cut -c1-16)

                  cat "$report" >> "$GITHUB_STEP_SUMMARY"
                  {
                    echo "drift=$drift"
                    echo "rpc_err=$rpc_err"
                    echo "fingerprint=$fingerprint"
                  } >> "$GITHUB_OUTPUT"
                  if [ "$drift" -eq 1 ]; then
                    echo "::error::Live mainnet WASM differs from deployments/mainnet.txt"
                    exit 1
                  fi
                  if [ "$rpc_err" -eq 1 ]; then
                    echo "::error::Could not fetch WASM from at least one RPC provider"
                    exit 1
                  fi

            - name: Keep report for the alert jobs
              if: always()
              uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
              with:
                  name: mainnet-report
                  path: /tmp/report.md
                  retention-days: 30

    alert:
        name: Alert on drift
        needs: check
        if: always() && needs.check.outputs.drift == '1'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            issues: write
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
            RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            FINGERPRINT: ${{ needs.check.outputs.fingerprint }}
            SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        steps:
            - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
              with:
                  name: mainnet-report
                  path: /tmp/report

            - name: Open issue, or comment on the open one for a new drift
              id: issue
              run: |
                  set -euo pipefail
                  label="mainnet-wasm-drift"
                  marker="<!-- drift-fingerprint:${FINGERPRINT} -->"
                  gh label create "$label" --color B60205 \
                    --description "Live mainnet WASM differs from deployments/mainnet.txt" 2>/dev/null || true
                  body=$(printf '%s\n\n%s\n\n%s\n\n%s\n\n%s\n' \
                    "🚨 The live WASM of at least one mainnet contract no longer matches \`deployments/mainnet.txt\`." \
                    "$(cat /tmp/report/report.md)" \
                    "Run: $RUN_URL" \
                    "If this was an approved upgrade, update \`deployments/mainnet.txt\` in a PR and close this issue. If not, treat it as an incident." \
                    "$marker")
                  # Only trust issues opened by this workflow's bot: anyone can
                  # comment on a public repo, so markers are read from bot-authored
                  # text only, or an attacker could pre-post one to mute an alert.
                  existing=$(gh issue list --label "$label" --state open --author "app/github-actions" \
                    --json number --jq '.[0].number // empty')
                  if [ -z "$existing" ]; then
                    url=$(gh issue create --title "🚨 Mainnet WASM hash drift detected" --label "$label" \
                      --assignee "$ALERT_ASSIGNEES" --body "$body")
                    echo "notify=true" >> "$GITHUB_OUTPUT"
                    echo "url=$url" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  url=$(gh issue view "$existing" --json url --jq .url)
                  echo "url=$url" >> "$GITHUB_OUTPUT"
                  seen=$(gh issue view "$existing" --json body,comments --jq \
                    "[.body, (.comments[] | select(.author.login == \"github-actions\") | .body)] | map(select(contains(\"$marker\"))) | length")
                  if [ "$seen" -eq 0 ]; then
                    # A drift we have not alerted on yet: full report + re-notify.
                    gh issue comment "$existing" --body "$body"
                    gh issue edit "$existing" --add-assignee "$ALERT_ASSIGNEES"
                    echo "notify=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "Drift already reported on #$existing; not re-alerting."
                    echo "notify=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Notify Slack
              if: steps.issue.outputs.notify == 'true'
              env:
                  ISSUE_URL: ${{ steps.issue.outputs.url }}
              run: |
                  set -euo pipefail
                  if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
                    echo "::warning::SLACK_WEBHOOK_URL is not set; drift was only reported as a GitHub issue."
                    exit 0
                  fi
                  text=$(printf ':rotating_light: *Mainnet WASM hash drift* on stellar-upshift-vault-contracts. A live vault no longer runs the approved bytecode.\nIssue: %s\nRun: %s' "$ISSUE_URL" "$RUN_URL")
                  payload=$(jq -n --arg t "$text" '{text: $t}')
                  curl -fsS -X POST -H 'Content-Type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"

    degraded:
        name: Report monitor degraded
        needs: check
        if: always() && needs.check.outputs.drift != '1' && (needs.check.outputs.rpc_err == '1' || needs.check.result == 'failure')
        runs-on: ubuntu-latest
        permissions:
            contents: read
            issues: write
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
            RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        steps:
            - name: Open or update degraded issue
              run: |
                  set -euo pipefail
                  label="mainnet-monitor-degraded"
                  gh label create "$label" --color FBCA04 \
                    --description "Mainnet monitor could not verify live WASM" 2>/dev/null || true
                  existing=$(gh issue list --label "$label" --state open --author "app/github-actions" --json number --jq '.[0].number // empty')
                  if [ -n "$existing" ]; then
                    echo "Already tracked in #$existing"
                  else
                    gh issue create --title "Mainnet monitor degraded: could not verify live WASM" \
                      --label "$label" --assignee "$ALERT_ASSIGNEES" \
                      --body "The hourly mainnet WASM check could not complete (RPC provider error or job failure), so live bytecode is currently NOT being verified. Run: $RUN_URL. Fix the provider (vars.MAINNET_RPC_PRIMARY / MAINNET_RPC_SECONDARY) and close this issue once runs are green."
                  fi

    keepalive:
        name: Keep schedule alive
        runs-on: ubuntu-latest
        permissions:
            actions: write
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
        steps:
            - name: Re-enable this workflow (resets the 60-day inactivity timer)
              run: gh api -X PUT "repos/$GH_REPO/actions/workflows/mainnet-monitor.yml/enable"
