name: Mainnet Monitor

# Hourly check that every live mainnet contract still runs the approved WASM.
#
# The vaults are upgradeable: the admin can replace the bytecode at any time.
# This workflow fetches each contract's live WASM from TWO independent RPC
# providers, hashes it, and compares it to deployments/mainnet.txt. On a
# mismatch it fails, opens (or updates) a GitHub issue that pings the code
# owners, and posts to Slack if SLACK_WEBHOOK_URL is configured.
#
# RPC errors are reported as a failed run but do NOT open an incident issue:
# only a hash we actually fetched and that disagrees is treated as drift.

on:
    schedule:
        - cron: "17 * * * *"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: mainnet-monitor
    cancel-in-progress: false

jobs:
    check:
        name: Live WASM hash check
        runs-on: ubuntu-latest
        timeout-minutes: 15
        outputs:
            drift: ${{ steps.check.outputs.drift }}
        env:
            NETWORK_PASSPHRASE: "Public Global Stellar Network ; September 2015"
            # Override with repo variables if a provider degrades.
            RPC_PRIMARY: ${{ vars.MAINNET_RPC_PRIMARY || 'https://mainnet.sorobanrpc.com' }}
            RPC_SECONDARY: ${{ vars.MAINNET_RPC_SECONDARY || 'https://soroban-rpc.mainnet.stellar.gateway.fm' }}
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  persist-credentials: false

            - name: Install Stellar CLI 27.0.0 (pinned .deb, checksum-verified)
              env:
                  STELLAR_CLI_DEB_SHA256: "4b3755e13ba7514a108e422b02c75233face37c3e2cde131f55e6c7ce6eea44e"
              run: |
                  set -euo pipefail
                  curl -fsSL -o /tmp/stellar-cli.deb \
                    https://github.com/stellar/stellar-cli/releases/download/v27.0.0/stellar-cli_27.0.0_amd64.deb
                  echo "${STELLAR_CLI_DEB_SHA256}  /tmp/stellar-cli.deb" | sha256sum -c -
                  sudo dpkg -i /tmp/stellar-cli.deb

            - name: Compare live hashes to deployments/mainnet.txt
              id: check
              run: |
                  set -uo pipefail
                  drift=0; rpc_err=0
                  report=/tmp/report.md
                  {
                    echo "| Contract | ID | Approved | Live (${RPC_PRIMARY}) | Live (${RPC_SECONDARY}) |"
                    echo "| --- | --- | --- | --- | --- |"
                  } > "$report"

                  fetch() { # rpc id -> sha256 or "ERROR"
                    local tag out
                    tag=$(echo "$1" | sha256sum | cut -c1-8)
                    out="/tmp/$2-$tag.wasm"
                    if stellar contract fetch --id "$2" --rpc-url "$1" \
                         --network-passphrase "$NETWORK_PASSPHRASE" --out-file "$out" >/dev/null 2>&1; then
                      sha256sum "$out" | cut -d' ' -f1
                    else
                      echo ERROR
                    fi
                  }

                  while read -r name id expected _; do
                    case "$name" in ''|\#*) continue ;; esac
                    a=$(fetch "$RPC_PRIMARY" "$id")
                    b=$(fetch "$RPC_SECONDARY" "$id")
                    status="✅"
                    for h in "$a" "$b"; do
                      if [ "$h" = ERROR ]; then
                        rpc_err=1; status="⚠️ RPC error"
                      elif [ "$h" != "$expected" ]; then
                        drift=1; status="🚨 DRIFT"
                      fi
                    done
                    echo "$status $name $id expected=$expected primary=$a secondary=$b"
                    echo "| $status $name | \`$id\` | \`${expected:0:12}…\` | \`${a:0:12}…\` | \`${b:0:12}…\` |" >> "$report"
                  done < deployments/mainnet.txt

                  cat "$report" >> "$GITHUB_STEP_SUMMARY"
                  echo "drift=$drift" >> "$GITHUB_OUTPUT"
                  if [ "$drift" -eq 1 ]; then
                    echo "::error::Live mainnet WASM differs from deployments/mainnet.txt"
                    exit 1
                  fi
                  if [ "$rpc_err" -eq 1 ]; then
                    echo "::error::Could not fetch WASM from at least one RPC provider"
                    exit 1
                  fi

            - name: Keep report for the alert job
              if: always()
              uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
              with:
                  name: mainnet-report
                  path: /tmp/report.md
                  retention-days: 30

    alert:
        name: Alert on drift
        needs: check
        if: always() && needs.check.outputs.drift == '1'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            issues: write
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
            RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        steps:
            - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
              with:
                  name: mainnet-report
                  path: /tmp/report

            - name: Open or update incident issue
              id: issue
              run: |
                  set -euo pipefail
                  label="mainnet-wasm-drift"
                  gh label create "$label" --color B60205 \
                    --description "Live mainnet WASM differs from deployments/mainnet.txt" 2>/dev/null || true
                  body=$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
                    "@upshift-protocol/stellar-contracts-owners the live WASM of at least one mainnet contract no longer matches \`deployments/mainnet.txt\`." \
                    "$(cat /tmp/report/report.md)" \
                    "Run: $RUN_URL" \
                    "If this was an approved upgrade, update \`deployments/mainnet.txt\` in a PR and close this issue. If not, treat it as an incident.")
                  existing=$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')
                  if [ -n "$existing" ]; then
                    gh issue comment "$existing" --body "Still drifting: $RUN_URL"
                    echo "new=false" >> "$GITHUB_OUTPUT"
                  else
                    url=$(gh issue create --title "🚨 Mainnet WASM hash drift detected" --label "$label" --body "$body")
                    echo "new=true" >> "$GITHUB_OUTPUT"
                    echo "url=$url" >> "$GITHUB_OUTPUT"
                  fi

            # Slack once per incident (when the issue is opened), not every hour.
            - name: Notify Slack
              if: steps.issue.outputs.new == 'true' && env.SLACK_WEBHOOK_URL != ''
              env:
                  ISSUE_URL: ${{ steps.issue.outputs.url }}
              run: |
                  set -euo pipefail
                  text=$(printf ':rotating_light: *Mainnet WASM hash drift* on stellar-upshift-vault-contracts. A live vault no longer runs the approved bytecode.\nIssue: %s\nRun: %s' "$ISSUE_URL" "$RUN_URL")
                  payload=$(jq -n --arg t "$text" '{text: $t}')
                  curl -fsS -X POST -H 'Content-Type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
