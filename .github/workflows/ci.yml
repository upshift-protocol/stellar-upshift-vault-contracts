name: CI

# NOTE: paths-ignore is intentionally NOT used here. Skipping the whole
# workflow on docs-only changes leaves the required "CI Pass" check pending
# forever, which blocks docs PRs. Instead the `changes` job below detects
# non-docs changes and gates the expensive jobs, while `CI Pass` always runs
# and reports a result.
on:
    pull_request:
        branches:
            - "*"
    push:
        branches:
            - main
            - develop

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # ============================================
    # Detect whether any non-docs files changed
    # ============================================
    changes:
        name: Detect changes
        runs-on: ubuntu-latest
        # paths-filter reads the PR's changed files via the API, which needs
        # pull-requests: read (the org's default GITHUB_TOKEN doesn't grant it).
        permissions:
            contents: read
            pull-requests: read
        outputs:
            code: ${{ steps.filter.outputs.code }}
        steps:
            - uses: actions/checkout@v4
            - uses: dorny/paths-filter@v3
              id: filter
              with:
                  filters: |
                      code:
                        - '**'
                        - '!**/*.md'
                        - '!docs/**'

    # ============================================
    # Format Check
    # ============================================
    fmt:
        name: Rustfmt
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@1.95.0
              with:
                  components: rustfmt

            - name: Check formatting
              run: cargo fmt --all --check

    # ============================================
    # Linting
    # ============================================
    clippy:
        name: Clippy
        runs-on: ubuntu-latest
        needs: changes
        if: needs.changes.outputs.code == 'true'
        steps:
            - uses: actions/checkout@v4

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@1.95.0
              with:
                  components: clippy
                  targets: wasm32-unknown-unknown

            - name: Cache Cargo
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
                  key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-clippy-

            - name: Run Clippy
              run: cargo clippy -p august-vault -p xlm-strategy --all-targets -- -D warnings

    # ============================================
    # Typo Check
    # ============================================
    typos:
        name: Typo Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: crate-ci/typos@v1.24.5

    # ============================================
    # Cargo Deny (advisories, licenses, bans, sources)
    # ============================================
    cargo-deny:
        name: Cargo Deny
        runs-on: ubuntu-latest
        needs: changes
        if: needs.changes.outputs.code == 'true'
        strategy:
            matrix:
                check: [advisories, bans, licenses, sources]
        continue-on-error: ${{ matrix.check == 'advisories' }}
        steps:
            - uses: actions/checkout@v4
            - uses: EmbarkStudios/cargo-deny-action@v2
              with:
                  command: check ${{ matrix.check }}

    # ============================================
    # ShellCheck
    # ============================================
    shellcheck:
        name: ShellCheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: ludeeus/action-shellcheck@master
              with:
                  scandir: scripts

    # ============================================
    # Build & Test
    # ============================================
    test:
        name: Build & Test
        runs-on: ubuntu-latest
        needs: [changes, fmt, clippy]
        if: needs.changes.outputs.code == 'true'

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@1.95.0
              with:
                  targets: wasm32-unknown-unknown

            - name: Cache Cargo
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
                  key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-test-

            - name: Run tests
              run: cargo test --all

            - name: Build WASM (release)
              run: cargo build --target wasm32-unknown-unknown --release

            - name: Check WASM size
              run: |
                  WASM_FILE="target/wasm32-unknown-unknown/release/august_vault.wasm"
                  if [ -f "$WASM_FILE" ]; then
                    WASM_SIZE=$(wc -c < "$WASM_FILE")
                    WASM_SIZE_KB=$((WASM_SIZE / 1024))
                    echo "WASM size: ${WASM_SIZE_KB}KB ($WASM_SIZE bytes)"
                    MAX_SIZE=262144
                    if [ "$WASM_SIZE" -gt "$MAX_SIZE" ]; then
                      echo "::error::WASM size ($WASM_SIZE bytes) exceeds Soroban limit (256KB)!"
                      exit 1
                    fi
                  fi

            - name: Install stellar CLI
              run: |
                  curl -fsSL -o /tmp/stellar-cli.deb https://github.com/stellar/stellar-cli/releases/download/v25.1.0/stellar-cli_25.1.0_amd64.deb
                  sudo dpkg -i /tmp/stellar-cli.deb
                  rm /tmp/stellar-cli.deb
                  echo "stellar CLI: $(stellar --version)"

            - name: Optimize WASM
              run: |
                  WASM_FILE=$(find target/wasm32-unknown-unknown/release -name "*.wasm" -not -name "*.d" | head -1)
                  if [ -n "$WASM_FILE" ]; then
                    stellar contract optimize --wasm "$WASM_FILE" --wasm-out target/wasm32-unknown-unknown/release/august_vault_optimized.wasm
                    OPT_SIZE=$(wc -c < target/wasm32-unknown-unknown/release/august_vault_optimized.wasm)
                    OPT_SIZE_KB=$((OPT_SIZE / 1024))
                    echo "Optimized WASM size: ${OPT_SIZE_KB}KB ($OPT_SIZE bytes)"
                  fi

            - name: Upload WASM artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: contract-wasm
                  path: |
                      target/wasm32-unknown-unknown/release/*.wasm
                      !target/wasm32-unknown-unknown/release/*.d
                  retention-days: 90

    # ============================================
    # E2E Tests (local Stellar network)
    # ============================================
    e2e:
        name: E2E Tests
        runs-on: ubuntu-latest
        needs: [changes, test]
        if: needs.changes.outputs.code == 'true'

        services:
            stellar:
                # Pinned to an immutable quickstart build (protocol 25, core
                # v26.1.0) instead of the rolling :testing tag. :testing now
                # ships a pre-release Soroban host (protocol 27) that no
                # released stellar-cli is compatible with, so `stellar contract
                # asset deploy` fails at simulation with
                # HostError: Error(Context, InternalError). Keep this in lockstep
                # with the stellar-cli version installed below (v25.1.0): both
                # must speak the same protocol.
                image: stellar/quickstart:v638-b1076.1-testing
                ports:
                    - 8000:8000
                options: >-
                    --health-cmd "curl -sf http://localhost:8000/soroban/rpc -X POST -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getHealth\"}' | grep -q '\"status\":\"healthy\"' || exit 1"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 30
                env:
                    ENABLE_SOROBAN_RPC: "true"
                    NETWORK: local

        steps:
            - uses: actions/checkout@v4

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@1.95.0
              with:
                  targets: wasm32-unknown-unknown

            - name: Cache Cargo
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
                  key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-e2e-

            - name: Install stellar CLI
              run: |
                  if ! command -v stellar &>/dev/null; then
                    curl -fsSL -o /tmp/stellar-cli.deb https://github.com/stellar/stellar-cli/releases/download/v25.1.0/stellar-cli_25.1.0_amd64.deb
                    sudo dpkg -i /tmp/stellar-cli.deb
                    rm /tmp/stellar-cli.deb
                  fi
                  echo "stellar CLI: $(stellar --version)"

            - name: Run E2E tests
              run: ./scripts/e2e-test.sh --ci
              env:
                  STELLAR_RPC_URL: http://localhost:8000/soroban/rpc
                  STELLAR_NETWORK_PASSPHRASE: "Standalone Network ; February 2017"
                  STELLAR_FRIENDBOT_URL: http://localhost:8000/friendbot

    # ============================================
    # Code Coverage (PRs only)
    # ============================================
    coverage:
        name: Code Coverage
        runs-on: ubuntu-latest
        needs: [changes, test]
        if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'

        steps:
            - uses: actions/checkout@v4

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@1.95.0
              with:
                  components: llvm-tools-preview

            - name: Cache cargo-llvm-cov
              id: cache-llvm-cov
              uses: actions/cache@v4
              with:
                  path: ~/.cargo/bin/cargo-llvm-cov
                  key: ${{ runner.os }}-cargo-llvm-cov

            - name: Install cargo-llvm-cov
              if: steps.cache-llvm-cov.outputs.cache-hit != 'true'
              run: cargo install cargo-llvm-cov --locked

            - name: Generate coverage report
              run: cargo llvm-cov --all-features --fail-under-lines 80 --lcov --output-path lcov.info

            - name: Upload coverage artifact
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: lcov.info
                  retention-days: 5

    # ============================================
    # Reproducible Build (enforce the attested hashes)
    #
    # Rebuilds each contract with the pinned RELEASE toolchain (Rust 1.95.0,
    # Stellar CLI 25.1.0, wasm32v1-none, --meta source_repo) — the same build the
    # release workflow attests — and asserts the sha256 matches reproducible-hashes.txt.
    # CI runners are linux/amd64, so no container is needed here (that's only for
    # reproducing on other hosts; see VERIFY.md § B). A bytecode change must update
    # reproducible-hashes.txt in the same PR, or this fails.
    # ============================================
    reproducible-build:
        name: Reproducible Build
        runs-on: ubuntu-latest
        needs: changes
        if: needs.changes.outputs.code == 'true'
        env:
            RUSTUP_TOOLCHAIN: "1.95.0"
            REPO: ${{ github.repository }}
        steps:
            - uses: actions/checkout@v4

            - name: Install pinned Rust 1.95.0 + wasm target
              run: |
                  set -euo pipefail
                  rustup toolchain install 1.95.0 --profile minimal
                  rustup target add wasm32v1-none --toolchain 1.95.0

            - name: Install Stellar CLI 25.1.0 (pinned .deb, checksum-verified)
              env:
                  STELLAR_CLI_DEB_SHA256: "0260de467b29883c7cc227a3d8df7b7d8723805ffa54dcfe8171af1255de33c8"
              run: |
                  set -euo pipefail
                  curl -fsSL -o /tmp/stellar-cli.deb \
                    https://github.com/stellar/stellar-cli/releases/download/v25.1.0/stellar-cli_25.1.0_amd64.deb
                  echo "${STELLAR_CLI_DEB_SHA256}  /tmp/stellar-cli.deb" | sha256sum -c -
                  sudo dpkg -i /tmp/stellar-cli.deb
                  stellar --version

            - name: Rebuild and assert expected hashes
              run: |
                  set -euo pipefail
                  fail=0
                  while read -r pkg expected _; do
                    case "$pkg" in ''|\#*) continue ;; esac
                    stellar contract build --optimize --package "$pkg" --out-dir "out-$pkg" \
                      --meta source_repo="github:$REPO" >/dev/null
                    n=$(find "out-$pkg" -name '*.wasm' | wc -l | tr -d ' ')
                    [ "$n" -eq 1 ] || { echo "::error::$pkg: expected exactly one wasm, found $n"; fail=1; continue; }
                    got=$(sha256sum "out-$pkg"/*.wasm | cut -d' ' -f1)
                    if [ "$got" = "$expected" ]; then
                      echo "✓ $pkg $got"
                    else
                      echo "::error::$pkg reproducible-hash mismatch: got $got, expected $expected. If this bytecode change is intentional, update reproducible-hashes.txt in this PR."
                      fail=1
                    fi
                  done < reproducible-hashes.txt
                  [ "$fail" -eq 0 ]

    # ============================================
    # CI Pass (aggregator for branch protection)
    #
    # Always runs and reports, so it is a stable required status check even
    # for docs-only PRs (where the gated jobs are skipped). A skipped job is
    # not a failure; this only fails the merge if a job actually failed.
    # ============================================
    ci-pass:
        name: CI Pass
        if: always()
        runs-on: ubuntu-latest
        needs: [changes, fmt, clippy, typos, cargo-deny, shellcheck, test, e2e, coverage, reproducible-build]
        steps:
            - name: Check all jobs
              run: |
                  results="${{ join(needs.*.result, ' ') }}"
                  echo "Job results: $results"
                  for r in $results; do
                    if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
                      echo "::error::One or more required jobs failed or were cancelled"
                      exit 1
                    fi
                  done
                  echo "All jobs passed or were skipped."
